  summary: Trabajo desde el 2011 como Analista Macroeconómico en el Ministerio de Economía de la Nación (Argentina). Estuve cuatro años en la Tesorería General de la Nación, haciendo principalmente análisis de programación financiera de la caja del tesoro. Después de eso me pasé a la Dirección Nacional de Modelos y Proyecciones de la secretaria de Política Económica, donde trabajo con modelos macroeconómicos. Me dedico especialmente a la automatización de procesos, análisis de datos y docencia. Excel VBA, Python, R, y Stata.

